{% extends 'base.html' %}
{% block title %}{{ config.name }} | 404 Not Found{% endblock %}
{% block content %}
<section class="chapter full-height flex-center">
    <div class="container text-center">
        <h1 class="massive-text gradient-blue">404</h1>
        <h2>Page Not Found</h2>

        <a href="/" class="btn btn-primary mt-8">Return Home</a>
    </div>
</section>
{% endblock %}
